
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscription - CMC Fun Day</title>

<style>
:root {
  --blue:#0b2a6f;
  --blue-light:#1ca8e8;
  --yellow:#f5b800;
  --bg:#eaf6fd;
  --text:#1d2433;
  --muted:#5b6474;
  --white:#ffffff;
  --error:#c62828;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  background:linear-gradient(180deg,var(--bg),#ffffff);
  color:var(--text);
  min-height:100vh;
  padding:16px;
}

.card {
  max-width:560px;
  margin:0 auto;
  background:var(--white);
  border-radius:18px;
  box-shadow:0 10px 30px rgba(11,42,111,.15);
  overflow:hidden;
}

header {
  background:linear-gradient(135deg,var(--blue),var(--blue-light));
  color:var(--white);
  text-align:center;
  padding:28px 20px;
}

header h1 {
  margin:0 0 6px;
  font-size:2rem;
  letter-spacing:1px;
}

header h1 span { color:var(--yellow); }
header p { margin:4px 0; font-size:.95rem; }

.info {
  background:var(--blue);
  color:var(--white);
  display:flex;
  flex-wrap:wrap;
  justify-content:space-around;
  gap:8px;
  padding:12px;
  font-size:.9rem;
}

form { padding:22px 20px 26px; }
.field { margin-bottom:16px; }

label.title {
  display:block;
  font-weight:600;
  margin-bottom:6px;
  color:var(--blue);
}

input[type="text"],
input[type="email"],
input[type="tel"],
select {
  width:100%;
  padding:11px 12px;
  border:1.5px solid #cfd8e3;
  border-radius:10px;
  font-size:1rem;
  background:#fff;
}

input:focus,select:focus {
  outline:none;
  border-color:var(--blue-light);
  box-shadow:0 0 0 3px rgba(28,168,232,.2);
}

.activities {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.activity {
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  border:1.5px solid #cfd8e3;
  border-radius:10px;
  cursor:pointer;
  user-select:none;
}

.activity input {
  accent-color:var(--blue);
  width:18px;
  height:18px;
  flex-shrink:0;
}

.activity:has(input:checked) {
  border-color:var(--blue-light);
  background:#eef9ff;
}

.activity input:disabled {
  cursor:not-allowed;
}

.activity:has(input:disabled):not(:has(input:checked)) {
  opacity:.45;
  cursor:not-allowed;
}

.hint {
  font-size:.85rem;
  color:var(--muted);
  margin-top:6px;
}

#activityCount {
  color:var(--blue);
  font-weight:700;
  margin-left:5px;
}

.required { color:var(--error); }

button {
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:var(--yellow);
  color:var(--blue);
  font-size:1.1rem;
  font-weight:700;
  cursor:pointer;
  margin-top:6px;
}

button:hover { filter:brightness(1.05); }
button:disabled { opacity:.6; cursor:wait; }

#msg {
  margin-top:16px;
  padding:12px;
  border-radius:10px;
  display:none;
  text-align:center;
  font-weight:600;
}

#msg.ok {
  display:block;
  background:#e8f7ee;
  color:#1b5e20;
}

#msg.err {
  display:block;
  background:#fdecec;
  color:var(--error);
}

@media(max-width:480px) {
  .activities { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<div class="card">

  <header>
    <h1>CMC <span>FUN DAY</span></h1>
    <p>يوم ثقافي وترفيهي · Journée culturelle et récréative</p>
  </header>

  <div class="info">
    <div>📅 26 / 11 / 2026</div>
    <div>🕘 09:00 → 14:00</div>
    <div>📍 COP — Centre d'Orientation Professionnelle</div>
  </div>

  <form id="form" novalidate>

    <div class="field">
      <label class="title" for="nom">
        Nom <span class="required">*</span>
      </label>
      <input type="text" id="nom" name="nom"
             autocomplete="family-name" required>
    </div>

    <div class="field">
      <label class="title" for="prenom">
        Prénom <span class="required">*</span>
      </label>
      <input type="text" id="prenom" name="prenom"
             autocomplete="given-name" required>
    </div>

    <div class="field">
      <label class="title" for="telephone">
        Téléphone <span class="required">*</span>
      </label>
      <input type="tel" id="telephone" name="telephone"
             placeholder="06 12 34 56 78"
             autocomplete="tel" required>
    </div>

    <div class="field">
      <label class="title" for="email">Email</label>
      <input type="email" id="email" name="email"
             placeholder="exemple@mail.com"
             autocomplete="email">
    </div>

    <div class="field">
      <label class="title" for="filiere">Filière / Niveau</label>
      <input type="text" id="filiere" name="filiere"
             placeholder="Ex : Développement digital, 1ère année">
    </div>

    <div class="field">
      <label class="title">
        Activités auxquelles vous voulez participer
        <span class="required">*</span>
      </label>

      <div class="activities">

        <label class="activity">
          <input type="checkbox" name="activites" value="UNO"> 🃏 UNO
        </label>

        <label class="activity">
          <input type="checkbox" name="activites" value="Échecs"> ♟️ Échecs
        </label>

        <label class="activity">
          <input type="checkbox" name="activites" value="PlayStation"> 🎮 PlayStation
        </label>

        <label class="activity">
          <input type="checkbox" name="activites" value="Jeux culturels"> 🧠 Jeux culturels
        </label>

        <label class="activity">
          <input type="checkbox" name="activites" value="Jeux d'équipes"> 🤝 Jeux d'équipes
        </label>

        <label class="activity">
          <input type="checkbox" name="activites" value="Jeux de concentration"> 🎯 Jeux de concentration
        </label>

        <label class="activity">
          <input type="checkbox" name="activites" value="Monopoly"> 🏠 Monopoly
        </label>

        <label class="activity">
          <input type="checkbox" name="activites" value="Parchís"> 🎲 Parchís
        </label>

        <label class="activity">
          <input type="checkbox" name="activites" value="Mafia card"> 🕵️ Mafia card
        </label>

        <label class="activity">
          <input type="checkbox" name="activites" value="Quick Eye"> 👀 Quick Eye
        </label>

        <label class="activity">
          <input type="checkbox" name="activites" value="Bottle Hunter"> 🧴 Bottle Hunter
        </label>

        <label class="activity">
          <input type="checkbox" name="activites" value="Reaction Challenge"> ⚡ Reaction Challenge
        </label>

      </div>

      <p class="hint">
        Vous pouvez choisir jusqu'à 3 activités maximum.
        <strong id="activityCount">0/3</strong>
      </p>
    </div>

    <button type="submit" id="submitBtn">
      Valider mon inscription
    </button>

    <div id="msg" role="status" aria-live="polite"></div>

  </form>
</div>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbw3xmllEAZe3QVJIgGOWJzaISrMTbZVn74cbR3Z2z8jLN7C0GTNhU5wkkeGVIMZzT64/exec";

const form = document.getElementById("form");
const msg = document.getElementById("msg");
const btn = document.getElementById("submitBtn");

const activityCheckboxes = document.querySelectorAll(
  'input[name="activites"]'
);

const activityCount = document.getElementById("activityCount");

// Limiter le choix à 3 activités maximum
function updateActivities() {
  const selected = document.querySelectorAll(
    'input[name="activites"]:checked'
  ).length;

  activityCount.textContent = selected + "/3";

  activityCheckboxes.forEach(checkbox => {
    checkbox.disabled = selected >= 3 && !checkbox.checked;
  });
}

// Actualiser les choix à chaque changement
activityCheckboxes.forEach(checkbox => {
  checkbox.addEventListener("change", updateActivities);
});

updateActivities();

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = type;
}

function isValidPhone(value) {
  const cleaned = value.replace(/[\s.-]/g, "");
  return /^(\+212|0)[5-7]\d{8}$/.test(cleaned);
}

function isValidEmail(value) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
}

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  msg.className = "";
  msg.textContent = "";

  const data = {
    nom: form.elements["nom"].value.trim(),
    prenom: form.elements["prenom"].value.trim(),
    telephone: form.elements["telephone"].value.trim(),
    email: form.elements["email"].value.trim(),
    filiere: form.elements["filiere"].value.trim(),
    activites: Array.from(
      form.querySelectorAll('input[name="activites"]:checked')
    ).map(item => item.value)
  };

  if (!data.nom || !data.prenom) {
    showMsg("Veuillez saisir votre nom et prénom.", "err");
    return;
  }

  if (!isValidPhone(data.telephone)) {
    showMsg("Numéro de téléphone invalide (ex : 06 12 34 56 78).", "err");
    return;
  }

  if (data.email && !isValidEmail(data.email)) {
    showMsg("Adresse email invalide.", "err");
    return;
  }

  if (data.activites.length === 0) {
    showMsg("Veuillez choisir au moins une activité.", "err");
    return;
  }

  if (data.activites.length > 3) {
    showMsg("Vous pouvez choisir 3 activités maximum.", "err");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Envoi en cours...";

  try {
    await fetch(ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });

    form.reset();

    updateActivities();

    showMsg(
      "Votre demande a été envoyée. Vérifiez la confirmation de votre inscription.",
      "ok"
    );

  } catch (error) {
    showMsg(
      "Erreur d'envoi. Veuillez réessayer.",
      "err"
    );

  } finally {
    btn.disabled = false;
    btn.textContent = "Valider mon inscription";
  }
});
</script>

</body>
</html>
